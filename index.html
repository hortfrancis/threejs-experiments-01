<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isometric floor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12141c; overflow: hidden; }
      /* The renderer's canvas is appended here and sized to fill the window. */
      canvas { display: block; }

      /* Interface is ordinary HTML sitting on top of the canvas. Three.js is
         not involved; this is just a button with a z-index. */
      #mode {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 10px 16px;
        font: 500 14px/1 system-ui, sans-serif;
        color: #e8ecf8;
        background: #242938;
        border: 1px solid #3a4157;
        border-radius: 8px;
        cursor: pointer;
      }

      #mode:hover { background: #2e3446; }
    </style>
  </head>
  <body>
    <button id="mode" type="button">Movement: free</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
