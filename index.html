<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js experiments</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 24px;
        box-sizing: border-box;
        background: #12141c;
        color: #e8ecf8;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main { max-width: 560px; margin: 0 auto; }

      h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }

      ul { list-style: none; margin: 0; padding: 0; }

      li + li { margin-top: 8px; }

      a {
        display: block;
        padding: 14px 16px;
        background: #1c2030;
        border: 1px solid #2a3145;
        border-radius: 8px;
        color: #e8ecf8;
        text-decoration: none;
      }

      a:hover { background: #242938; border-color: #3a4157; }

      .slug { color: #6f7899; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Three.js experiments</h1>
      <ul id="list"></ul>
    </main>
    <script type="module" src="/src/menu.js"></script>
  </body>
</html>
